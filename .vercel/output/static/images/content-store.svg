<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Ridge content-addressed store</title>
  <desc id="desc">A registry tarball is hashed into a global store, then linked into two project node_modules directories.</desc>
  <rect width="960" height="420" fill="#f4f1ea"/>
  <rect x="0" y="0" width="960" height="420" fill="none" stroke="#e2ddd3"/>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#6f6b63">
    <rect x="48" y="150" width="180" height="120" rx="12" fill="#fbfaf6" stroke="#cfc8ba"/>
    <text x="138" y="204" text-anchor="middle" fill="#1a1916" font-size="14">registry</text>
    <text x="138" y="224" text-anchor="middle">ms-2.1.3.tgz</text>
    <path d="M228 210 H300" stroke="#3f5270" stroke-width="1.5" fill="none"/>
    <polygon points="300,210 292,206 292,214" fill="#3f5270"/>
    <rect x="312" y="96" width="336" height="228" rx="16" fill="#fbfaf6" stroke="#cfc8ba"/>
    <text x="480" y="128" text-anchor="middle" fill="#1a1916" font-size="14">store</text>
    <text x="480" y="148" text-anchor="middle">sha512/9c/0aa2…</text>
    <rect x="352" y="176" width="256" height="96" rx="10" fill="#ece8df"/>
    <text x="480" y="220" text-anchor="middle" fill="#1a1916">package bytes</text>
    <text x="480" y="240" text-anchor="middle">written once</text>
    <path d="M648 180 H720" stroke="#3f5270" stroke-width="1.5" fill="none"/>
    <path d="M648 240 H720" stroke="#3f5270" stroke-width="1.5" fill="none"/>
    <polygon points="720,180 712,176 712,184" fill="#3f5270"/>
    <polygon points="720,240 712,236 712,244" fill="#3f5270"/>
    <rect x="732" y="120" width="180" height="88" rx="12" fill="#fbfaf6" stroke="#cfc8ba"/>
    <text x="822" y="160" text-anchor="middle" fill="#1a1916" font-size="14">app-a</text>
    <text x="822" y="180" text-anchor="middle">node_modules/ms</text>
    <rect x="732" y="228" width="180" height="88" rx="12" fill="#fbfaf6" stroke="#cfc8ba"/>
    <text x="822" y="268" text-anchor="middle" fill="#1a1916" font-size="14">app-b</text>
    <text x="822" y="288" text-anchor="middle">node_modules/ms</text>
  </g>
</svg>
